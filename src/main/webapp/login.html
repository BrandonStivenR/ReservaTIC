<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - ReservaTIC</title>
</head>
<body>
    <h1>Iniciar sesión</h1>
    <form action="login" method="post">
        <p>Correo institucional: <input type="email" name="correoInstitucional" required></p>
        <p>Contraseña: <input type="password" name="contrasena" required></p>
        <p><button type="submit">Ingresar</button></p>
    </form>
    <p id="error" style="color:red;"></p>
    <script>
        if (location.search.includes("error=1")) {
            document.getElementById("error").textContent = "Correo o contraseña incorrectos.";
        }
    </script>
    <a href="index.html">Volver al inicio</a>
</body>
</html>
